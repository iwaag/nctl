# Copy to nctl.toml at the pj-clusterintent repo root (git-ignored) and adjust.
# Never put an API token in this file; use token_env or token_file.

[nautobot]
url = "http://localhost:8000"
token_env = "NAUTOBOT_TOKEN"
# token_file = "~/.config/nctl/nautobot_token"

[inventory]
dumps_dir = "~/.local/state/nctl/dumps"

[events]
log_dir = "~/.local/state/nctl/events"

[ansible]
# ansible_agdev checkout, relative to this file's directory.
playbook_dir = "ansible_agdev"
# Absolute paths are accepted; relative paths resolve inside playbook_dir.
inventory = "inventories/generated/production.yml"

[repo]
# pj-clusterintent checkout, relative to this file's directory.
root = "."

[reconcile]
max_rounds = 3
job_poll_interval_seconds = 2
job_timeout_seconds = 300
ansible_timeout_seconds = 1800
remote_report_path = "/var/lib/nodeutils/inventory.json"
max_report_bytes = 2097152
max_report_age_hours = 72
ingest_policy_file = "seed/nodeutils_ingest.yaml"
service_observation_max_age_hours = 24
workspace_observation_max_age_hours = 24
lock_path = "~/.local/state/nctl/reconcile.lock"

[ssh]
# Local controller SSH trust store, keyed by the immutable DesiredNode UUID
# (see devdocs/small/fix_sshkey/plan.md, devdocs/small/fix_sshkey2/plan.md).
# Not a credential and not a generated repo artifact -- never commit this
# file or copy it into an operation artifact. known_hosts_file/lock_path: `~`
# expands, an absolute path stays absolute, and a relative path resolves
# against this nctl.toml's directory (not the process working directory).
known_hosts_file = "~/.local/state/nctl/ssh/known_hosts"
keyscan_timeout_seconds = 10
lock_path = "~/.local/state/nctl/ssh.lock"

[storage]
# MinIO backing `nctl upload`. Optional: only `nctl upload` needs it.
# endpoint is signed into presigned URLs -- pick the name recipients can
# actually reach (a LAN name, not localhost, if downloads happen elsewhere).
endpoint = "http://agstudio.local:9100"
bucket = "nctl-outbox"
access_key = "nctl"
# Raw file content (whitespace-stripped), not TOML; never an inline secret_key.
# Relative paths resolve against this nctl.toml's directory.
secret_key_file = ".local/minio-secret"
# secret_key_env = "NCTL_STORAGE_SECRET"   # alternative, mirroring token_env
default_ttl_minutes = 30


[zulip]
# Optional: only `nctl agents observe` needs it. `credentials_file` is a 0600
# `KEY=value` file holding ZULIP_EMAIL and ZULIP_API_KEY -- the same file shape
# the listeners already use, so no key is copied into a second place.
# Relative paths resolve against this nctl.toml's directory.
url = "https://zulip.example.invalid:8543"
credentials_file = ".local/zulip/observer.env"
# The local realm serves a self-signed certificate.
verify_tls = false

[plane]
# Optional: only `nctl agents observe` needs it. credentials_file holds PLANE_API_KEY.
url = "http://plane.example.invalid:8290"
workspace_slug = "agautolab"
credentials_file = ".local/plane-credentials.env"
